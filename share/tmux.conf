# tmux for the agent roster: `tmux -L roster -f ~/.config/roster/tmux.conf`, run
# by roster-tmux.service. Never mixed with a personal tmux. `roster install`
# writes it from roster's share/tmux.conf and adds this machine's @machine.
#
# tmux only keeps agents alive here; it never shows anything of its own. One
# session per agent, one window, no splits, no switching. Each agent gets its
# own terminal window (`roster attach`), and closing that window detaches.

set -g status off
set -g prefix None
set -g prefix2 None
set -g mouse off
set -s escape-time 0

set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set-environment -g COLORTERM truecolor
set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features ",*:extkeys"
set -g focus-events on
# Let programs inside set the clipboard (OSC 52), e.g. Claude's own "copy";
# tmux passes it on to the terminal, also over SSH from another machine.
set -s set-clipboard on

# The outer window title, roster:<name>@<machine>, is how roster finds an
# agent's window, here or on the machine attached over SSH. It follows the
# @roster option, which `roster rename` updates.
set -g set-titles on
set -g set-titles-string "roster:#{@roster}@#{@machine}"

# An agent's session lives until its claude exits or `roster kill`.
set -g destroy-unattached off
set -g exit-empty off
