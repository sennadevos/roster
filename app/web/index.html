<!DOCTYPE html>
<html>
<head>
  <!--
    The path the app is served at; `flutter build web --base-href` fills it
    in. It has to start and end with a slash.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="The roster's agents, their conversations and dialogs.">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Roster">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" href="favicon.png" sizes="32x32">

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#FAFCFC" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111516" media="(prefers-color-scheme: dark)">
  <title>Roster</title>
  <link rel="manifest" href="manifest.json">
  <!--
    Shown while the engine loads (a second or two), in the app's own
    background colour, so the page is never a white flash; removed by
    flutter_bootstrap.js once the app runs.
  -->
  <style>
    html, body { margin: 0; height: 100%; background: #FAFCFC; }
    @media (prefers-color-scheme: dark) { html, body { background: #111516; } }
    #splash { position: fixed; inset: 0; display: grid; place-items: center; transition: opacity .25s ease; }
    #splash img { width: 56px; height: 56px; animation: breathe 1.6s ease-in-out infinite; }
    #splash.gone { opacity: 0; }
    @keyframes breathe { 0%, 100% { opacity: .55; transform: scale(.96); } 50% { opacity: 1; transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) { #splash img { animation: none; } }
  </style>
</head>
<body>
  <div id="splash" aria-hidden="true"><img src="favicon.svg" alt=""></div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
